<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="18mm" height="10mm" viewBox="0 0 180 100"
     role="img" aria-labelledby="title desc">
  <title id="title">Elegantes kompaktes MD-Monogramm</title>
  <desc id="desc">Ein gleichmäßiges, geschwungenes Monoline-Monogramm aus M und D für den PCB-Siebdruck.</desc>

  <!-- Freie Bézierkurven, keine eingebettete Schriftart. -->
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- M: kompakte, ruhige Bögen -->
    <path stroke-width="9"
          d="M14 77
             C18 60 18 31 27 21
             C31 16 36 19 36 30
             C36 44 33 59 34 69
             C39 52 45 31 53 22
             C58 16 63 19 62 30
             C61 44 57 59 58 70
             C59 78 65 80 73 72"/>

    <!-- D: gleicher Duktus und optisch mit dem M verbunden -->
    <path stroke-width="9"
          d="M73 72
             C79 58 79 38 81 24
             C82 17 87 16 91 22
             C95 31 92 55 90 71
             C104 77 126 75 140 65
             C154 55 154 38 142 28
             C130 18 108 18 92 26"/>

    <!-- Kurzer, eleganter Abschluss -->
    <path stroke-width="5"
          d="M53 87 C83 91 122 89 158 80"/>
  </g>
</svg>
